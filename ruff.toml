# Lint only. The house style is hand-formatted %-formatting on Python 3.8, so
# no formatter runs here and the rules that would demand f-strings are off.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "B", "SIM105"]
# E402: gi.require_version(...) has to run before "from gi.repository import ...".
# B905: zip(strict=) is 3.10+, and the package declares python3 (>= 3.8).
ignore = ["E402", "B905"]
