plugins { id 'com.android.application' }
android {
    namespace 'io.github.shubshub.screenshot'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.shubshub.screenshot'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'io.github.shubshub.screenshot.EditorInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
