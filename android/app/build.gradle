plugins { id 'com.android.application' }
android {
    namespace 'io.github.shubshub.screenshot'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.shubshub.screenshot'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.31.0'
        testInstrumentationRunner 'io.github.shubshub.screenshot.EditorInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def keyPath = providers.environmentVariable('SCREENSHOT_KEYSTORE').orNull
            def passwordPath = providers.environmentVariable('SCREENSHOT_KEYSTORE_PASSWORD_FILE').orNull
            if (keyPath && passwordPath) {
                storeFile file(keyPath)
                storePassword file(passwordPath).text.trim()
                keyAlias 'programmers-screenshot'
                keyPassword storePassword
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
